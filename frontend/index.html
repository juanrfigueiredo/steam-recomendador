<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recomendador de Jogos Steam</title>
  <script src="js/theme.js?v=__BUILD__"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=__BUILD__" />
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <div class="brand">Recomendador Steam</div>
    </header>

    <main class="landing-hero">
      <h1>Descubra o que jogar a seguir</h1>
      <p>
        Entre com sua conta Steam para receber recomendações de jogos baseadas
        na sua própria biblioteca e horas jogadas. Gratuito, sem anúncio, sem
        rastrear sua navegação.
      </p>
      <button class="btn-steam" id="btn-login">Entrar com Steam</button>
    </main>
  </div>

  <script src="js/config.js?v=__BUILD__"></script>
  <script src="js/login.js?v=__BUILD__"></script>
  <script>
    document.getElementById("btn-login").addEventListener("click", () => {
      iniciarLoginSteam(`${API_BASE_URL}/auth/steam/login`);
    });
  </script>
</body>
</html>
