# Secrets (definidos com `wrangler secret put <NOME>`, nunca aqui em texto):
#   DATABASE_URL   -- connection string da Neon
#   STEAM_API_KEY  -- chave da Steam Web API
#   SESSION_SECRET -- chave aleatória usada para assinar o cookie de sessão
#
# Variáveis não sensíveis podem ficar aqui em [vars]:
[vars]
# URL do próprio Worker -- usada no fluxo OpenID da Steam (return_to/realm).
PUBLIC_BASE_URL = "https://steam-recomendador-api.juanrfigueiredo.workers.dev"
# URL do frontend (Cloudflare Pages) -- domínio diferente do Worker, usada
# para redirecionar após login e como origem permitida no CORS.
FRONTEND_URL = "https://steam-recomendador.pages.dev"