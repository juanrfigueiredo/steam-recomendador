name: Testar motor de recomendação

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
  workflow_dispatch: {}

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest
